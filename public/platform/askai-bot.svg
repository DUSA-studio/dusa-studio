    <rect x="30" y="36" width="100" height="98" rx="36" fill="url(#dzHead)"/>

    <rect x="40" y="64" width="80" height="42" rx="21" fill="url(#dzVisor)"/>
    <rect x="40.75" y="64.75" width="78.5" height="40.5" rx="20.25" fill="none" stroke="#4ED8C2" stroke-opacity="0.4" stroke-width="1.5"/>

